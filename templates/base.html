<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Study Group Finder{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation -->
    <header class="site-header">
        <nav class="navbar">
            <a href="/" class="logo">Study Group Finder</a>

            <button class="menu-toggle"
                    type="button"
                    aria-label="Toggle navigation"
                    aria-expanded="false"
                    aria-controls="nav-links">
                ☰
            </button>

                        <div class="nav-links" id="nav-links">
                <a href="{{ url_for('home_page') }}">Browse Sessions</a>
                <a href="{{ url_for('search_page') }}">Search Sessions</a>
                <a href="{{ url_for('create_session_page') }}">Create Session</a>

                {% if current_user.is_authenticated %}
                    <span class="nav-user">
                        Hi, {{ current_user.document.name }}
                    </span>

                    <form class="nav-logout"
                          action="{{ url_for('logout_page') }}"
                          method="post">
                        <input type="hidden"
                               name="csrf_token"
                               value="{{ csrf_token() }}">
                        <button class="nav-logout-button" type="submit">
                            Log out
                        </button>
                    </form>
                {% else %}
                    <a href="{{ url_for('signup_page') }}">Sign up</a>
                    <a href="{{ url_for('login_page') }}">Log in</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 Study Group Finder</p>
    </footer>

    <script>
        const menuToggle = document.querySelector(".menu-toggle");
        const navLinks = document.querySelector(".nav-links");

        menuToggle.addEventListener("click", () => {
            const isOpen = navLinks.classList.toggle("open");
            menuToggle.setAttribute("aria-expanded", String(isOpen));
        });
    </script>

</body>
</html>
